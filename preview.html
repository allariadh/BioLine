<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioLine Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      html { scroll-behavior: smooth; }
      body { margin: 0; font-family: Inter, Tajawal, Cairo, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </head>
  <body class="bg-white">
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useState } = React;

      const images = {
        logo: "/images/bioline-logo.png",
        hero: "/images/page-1jpeg.jpeg",
        seal: "/images/page-3.jpeg",
        insert: "/images/page-2.jpeg",
        sequence: "/images/page-4.jpeg",
      };

      function Icon({ name, className = "h-5 w-5" }) {
        return <i data-lucide={name} className={className}></i>;
      }

      function SectionHeading({ eyebrowAr, eyebrowFr, titleAr, titleFr, bodyAr, bodyFr }) {
        return (
          <div className="mx-auto max-w-3xl text-center">
            <div className="mb-3 inline-flex items-center gap-2 rounded-full border border-blue-100 bg-white px-4 py-2 text-sm font-semibold text-blue-700 shadow-sm">
              <Icon name="badge-check" className="h-4 w-4" />
              <span>{eyebrowAr}</span>
              <span className="text-gray-400">/ {eyebrowFr}</span>
            </div>
            <h2 className="text-3xl font-bold tracking-normal text-gray-950 md:text-4xl">{titleAr}</h2>
            <p className="mt-2 text-lg text-gray-500">{titleFr}</p>
            {bodyAr && (
              <div className="mx-auto mt-5 max-w-2xl leading-8 text-gray-600">
                <p>{bodyAr}</p>
                <p className="mt-1 text-sm leading-7 text-gray-500">{bodyFr}</p>
              </div>
            )}
          </div>
        );
      }

      function App() {
        const [submitted, setSubmitted] = useState(false);

        useEffect(() => {
          if (window.lucide) window.lucide.createIcons();
        });

        const features = [
          ["shield-check", "أمان مخبري أعلى", "Sécurité renforcée", "نظام مغلق يقلل التعرض المباشر للعينات البيولوجية ويحد من الروائح وانتشار الملوثات.", "Un système fermé qui réduit l’exposition directe aux échantillons biologiques."],
          ["sparkles", "صمام ذاتي الإغلاق", "Valve auto-obturante", "صمام TPE مرن يسمح بمرور الماصة ثم يغلق تلقائيا بعد السحب دون فتح الغطاء.", "La valve TPE se referme automatiquement après le passage de la pipette."],
          ["test-tube-2", "توافق عملي واسع", "Compatibilité universelle", "مصمم ليتلاءم مع سير العمل اليومي في المخابر والعيادات ومراكز التحاليل.", "Pensé pour s’intégrer aux routines des laboratoires et cliniques."],
          ["hand-coins", "كفاءة اقتصادية", "Rentabilité maîtrisée", "حل بسيط يقلل خطوات المناولة، ويحسن سرعة العمل، ويساعد على خفض مخاطر الهدر.", "Moins de manipulations, plus de fluidité et une meilleure maîtrise des risques."],
        ];

        const steps = [
          ["01", "syringe", "إدخال الماصة مباشرة", "Insérer la pipette", "يتم إدخال الماصة عبر الصمام الرمادي دون الحاجة إلى فتح الكوب أو لمس العينة.", "La pipette traverse la valve sans ouvrir le récipient.", images.insert],
          ["02", "flask-conical", "سحب العينة بأمان", "Extraire l’échantillon", "تتم عملية السحب داخل نظام مغلق يحافظ على نظافة بيئة العمل وسلامة الطاقم.", "Le prélèvement se fait dans un environnement fermé.", images.sequence],
          ["03", "lock-keyhole", "إغلاق تلقائي بعد السحب", "Fermeture automatique", "بعد إخراج الماصة، يعود الصمام إلى وضعه المغلق تلقائيا للحفاظ على العينة.", "Après retrait, la valve protège le contenu.", images.hero],
        ];

        function submit(event) {
          event.preventDefault();
          event.currentTarget.reset();
          setSubmitted(true);
        }

        return (
          <main dir="rtl" className="min-h-screen bg-white text-gray-900">
            <nav className="sticky top-0 z-50 border-b border-blue-100/80 bg-white/90 backdrop-blur-xl">
              <div className="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
                <a href="#top" className="flex items-center gap-3">
                  <img src={images.logo} alt="BioLine" className="h-12 w-auto object-contain sm:h-14" />
                </a>
                <div className="hidden items-center gap-7 lg:flex">
                  {[
                    ["#solution", "المشكلة والحل", "Problème & solution"],
                    ["#features", "المزايا", "Avantages"],
                    ["#process", "كيف يعمل", "Comment ça marche"],
                    ["#contact", "تواصل معنا", "Contact"],
                  ].map(([href, ar, fr]) => (
                    <a key={href} href={href} className="text-sm font-semibold text-gray-700 transition hover:text-blue-700">
                      {ar}<span className="mr-1 text-xs font-medium text-gray-400">/ {fr}</span>
                    </a>
                  ))}
                </div>
                <a href="#contact" className="hidden rounded-lg bg-blue-700 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-blue-700/20 transition hover:bg-blue-800 md:inline-flex">
                  طلب عرض تجريبي
                </a>
              </div>
            </nav>

            <section id="top" className="overflow-hidden bg-gradient-to-b from-blue-50 via-white to-white">
              <div className="mx-auto grid max-w-7xl items-center gap-12 px-4 py-16 sm:px-6 md:py-24 lg:grid-cols-2 lg:px-8">
                <div className="order-2 lg:order-1">
                  <div className="mb-6 inline-flex items-center gap-2 rounded-full border border-blue-200 bg-white px-4 py-2 text-sm font-bold text-blue-800 shadow-sm">
                    <Icon name="shield-check" className="h-4 w-4" />
                    نظام مغلق 100% <span className="text-gray-400">/ Système fermé</span>
                  </div>
                  <h1 className="max-w-3xl text-4xl font-black leading-tight tracking-normal text-gray-950 sm:text-5xl lg:text-6xl">
                    ثورة الأمان في المخابر الطبية
                  </h1>
                  <p className="mt-4 text-2xl font-semibold text-blue-700">La révolution de la sécurité en laboratoire</p>
                  <div className="mt-6 max-w-2xl space-y-3 text-lg leading-8 text-gray-700">
                    <p>BioLine كوب عينات بيولوجية مبتكر مزود بصمام TPE ذاتي الإغلاق، يسمح بسحب العينة دون فتح الغطاء ودون تعريض الطاقم أو البيئة المخبرية للروائح أو التلوث المتبادل.</p>
                    <p className="text-base leading-7 text-gray-500">BioLine est un récipient biologique innovant avec valve TPE auto-obturante, conçu pour prélever sans ouverture manuelle.</p>
                  </div>
                  <div className="mt-9 flex flex-col gap-3 sm:flex-row">
                    <a href="#contact" className="inline-flex items-center justify-center gap-2 rounded-lg bg-blue-700 px-7 py-4 text-base font-bold text-white shadow-xl shadow-blue-700/20 transition hover:bg-blue-800">
                      اطلب عينة تجريبية <Icon name="arrow-left" />
                    </a>
                    <a href="#process" className="inline-flex items-center justify-center rounded-lg border border-blue-200 bg-white px-7 py-4 text-base font-bold text-blue-800 transition hover:bg-blue-50">
                      شاهد طريقة العمل
                    </a>
                  </div>
                </div>
                <div className="order-1 lg:order-2">
                  <div className="relative mx-auto max-w-xl">
                    <div className="absolute -inset-6 rounded-full bg-blue-200/40 blur-3xl"></div>
                    <div className="relative overflow-hidden rounded-2xl border border-blue-100 bg-white p-3 shadow-2xl shadow-blue-900/10">
                      <img src={images.hero} alt="كوب BioLine" className="h-[360px] w-full rounded-xl object-cover sm:h-[480px]" />
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <section id="solution" className="bg-white px-4 py-20 sm:px-6 lg:px-8">
              <SectionHeading
                eyebrowAr="التحدي الطبي"
                eyebrowFr="Enjeu médical"
                titleAr="من كوب مفتوح إلى نظام آمن ومغلق"
                titleFr="Du récipient ouvert au système fermé sécurisé"
                bodyAr="المناولة التقليدية للعينات تفرض فتح الغطاء يدويا، مما يزيد الروائح، احتمالات الرذاذ، والتلوث المتبادل."
                bodyFr="La manipulation classique impose l’ouverture manuelle, avec plus d’odeurs et de risques."
              />
              <div className="mx-auto mt-12 grid max-w-6xl gap-6 md:grid-cols-2">
                <div className="rounded-2xl border border-red-100 bg-red-50/70 p-7">
                  <h3 className="text-2xl font-bold text-gray-950">الأكواب التقليدية</h3>
                  <p className="text-sm text-gray-500">Récipients traditionnels</p>
                  <ul className="mt-5 space-y-4 leading-7 text-gray-700">
                    <li>فتح يدوي متكرر للغطاء أثناء التحليل.</li>
                    <li>روائح مزعجة واحتمال تعرض مباشر للعينة.</li>
                    <li>مخاطر تلوث متبادل بين الأدوات والأسطح.</li>
                  </ul>
                </div>
                <div className="rounded-2xl border border-blue-100 bg-blue-50 p-7">
                  <h3 className="text-2xl font-bold text-gray-950">حل BioLine المغلق</h3>
                  <p className="text-sm text-gray-500">Solution fermée BioLine</p>
                  <ul className="mt-5 space-y-4 leading-7 text-gray-700">
                    <li>سحب مباشر عبر صمام TPE دون فتح الغطاء.</li>
                    <li>تقليل الروائح والتعرض للعينة أثناء العمل.</li>
                    <li>حماية أفضل للطاقم، العينة، وبيئة المختبر.</li>
                  </ul>
                </div>
              </div>
            </section>

            <section id="features" className="bg-slate-50 px-4 py-20 sm:px-6 lg:px-8">
              <SectionHeading eyebrowAr="المزايا الأساسية" eyebrowFr="Avantages clés" titleAr="مصمم للسلامة، السرعة، والثقة" titleFr="Conçu pour la sécurité, la rapidité et la confiance" />
              <div className="mx-auto mt-12 grid max-w-7xl gap-6 lg:grid-cols-3">
                <div className="grid gap-6 sm:grid-cols-2 lg:col-span-2">
                  {features.map(([icon, ar, fr, bodyAr, bodyFr]) => (
                    <article key={ar} className="rounded-2xl border border-blue-100 bg-white p-6 shadow-sm">
                      <div className="mb-5 flex h-12 w-12 items-center justify-center rounded-lg bg-blue-700 text-white">
                        <Icon name={icon} className="h-6 w-6" />
                      </div>
                      <h3 className="text-xl font-bold text-gray-950">{ar}</h3>
                      <p className="mt-1 text-sm font-medium text-gray-500">{fr}</p>
                      <p className="mt-4 leading-7 text-gray-700">{bodyAr}</p>
                      <p className="mt-2 text-sm leading-6 text-gray-500">{bodyFr}</p>
                    </article>
                  ))}
                </div>
                <aside className="overflow-hidden rounded-2xl border border-blue-100 bg-white shadow-xl shadow-blue-900/5">
                  <img src={images.seal} alt="ختم ألمنيوم BioLine" className="h-72 w-full object-cover" />
                  <div className="p-7">
                    <h3 className="text-2xl font-bold text-gray-950">تعقيم محفوظ بنسبة 100%</h3>
                    <p className="mt-1 text-sm font-medium text-gray-500">Stérilité maintenue à 100%</p>
                    <p className="mt-4 leading-7 text-gray-700">ختم الألمنيوم المضاد للعبث يمنح طبقة حماية إضافية قبل الاستخدام.</p>
                  </div>
                </aside>
              </div>
            </section>

            <section id="process" className="bg-white px-4 py-20 sm:px-6 lg:px-8">
              <SectionHeading eyebrowAr="كيف يعمل" eyebrowFr="Comment ça marche" titleAr="ثلاث خطوات بسيطة دون فتح الغطاء" titleFr="Trois étapes simples sans ouverture du couvercle" />
              <div className="mx-auto mt-12 grid max-w-7xl gap-6 lg:grid-cols-3">
                {steps.map(([num, icon, ar, fr, bodyAr, bodyFr, image]) => (
                  <article key={num} className="overflow-hidden rounded-2xl border border-blue-100 bg-white shadow-lg shadow-blue-900/5">
                    <div className="relative">
                      <img src={image} alt={ar} className="h-72 w-full object-cover" />
                      <div className="absolute right-4 top-4 rounded-lg bg-blue-700 px-4 py-2 text-lg font-black text-white shadow-lg">{num}</div>
                    </div>
                    <div className="p-6">
                      <div className="mb-4 flex items-center gap-3">
                        <div className="flex h-11 w-11 items-center justify-center rounded-lg bg-blue-50 text-blue-800">
                          <Icon name={icon} />
                        </div>
                        <div>
                          <h3 className="text-xl font-bold text-gray-950">{ar}</h3>
                          <p className="text-sm text-gray-500">{fr}</p>
                        </div>
                      </div>
                      <p className="leading-7 text-gray-700">{bodyAr}</p>
                      <p className="mt-2 text-sm leading-6 text-gray-500">{bodyFr}</p>
                    </div>
                  </article>
                ))}
              </div>
            </section>

            <section id="contact" className="bg-blue-900 px-4 py-20 sm:px-6 lg:px-8">
              <div className="mx-auto grid max-w-7xl items-start gap-10 lg:grid-cols-[0.9fr_1.1fr]">
                <div className="text-white">
                  <h2 className="text-3xl font-black leading-tight tracking-normal md:text-5xl">هل ترغب في تجربة BioLine داخل مخبرك؟</h2>
                  <p className="mt-4 text-lg leading-8 text-blue-100">اترك بياناتك وسيتواصل معك فريقنا لترتيب عرض تجريبي أو ملف المواصفات التقنية.</p>
                  <p className="mt-2 text-base leading-7 text-blue-200">Laissez vos coordonnées pour organiser une démonstration ou recevoir la fiche technique.</p>
                </div>
                <form onSubmit={submit} className="rounded-2xl bg-white p-6 shadow-2xl shadow-blue-950/30 sm:p-8">
                  <div className="grid gap-5 sm:grid-cols-2">
                    {["الاسم الكامل / Nom complet", "العيادة أو المخبر / Clinique ou labo", "رقم الهاتف / Téléphone", "البريد الإلكتروني / Email"].map((label, index) => (
                      <label key={label} className="block">
                        <span className="mb-2 block text-sm font-bold text-gray-800">{label}</span>
                        <input required type={index === 3 ? "email" : index === 2 ? "tel" : "text"} className="w-full rounded-lg border border-gray-200 px-4 py-3 text-gray-900 outline-none transition focus:border-blue-600 focus:ring-4 focus:ring-blue-100" />
                      </label>
                    ))}
                  </div>
                  <button type="submit" className="mt-6 inline-flex w-full items-center justify-center gap-2 rounded-lg bg-blue-700 px-6 py-4 text-base font-bold text-white shadow-lg shadow-blue-700/20 transition hover:bg-blue-800">
                    إرسال الطلب <Icon name="arrow-left" />
                  </button>
                  {submitted && (
                    <div className="mt-5 rounded-lg border border-green-200 bg-green-50 p-4 text-green-800">
                      <p className="font-bold">تم إرسال طلبك بنجاح.</p>
                      <p className="mt-1 text-sm text-green-700">Votre demande a bien été enregistrée.</p>
                    </div>
                  )}
                </form>
              </div>
            </section>

            <footer className="bg-white px-4 py-8 sm:px-6 lg:px-8">
              <div className="mx-auto flex max-w-7xl flex-col items-center justify-between gap-4 border-t border-blue-100 pt-8 text-center md:flex-row">
                <img src={images.logo} alt="BioLine" className="h-10 w-auto object-contain" />
                <p className="text-sm text-gray-500">© 2026 BioLine. جميع الحقوق محفوظة / Tous droits réservés.</p>
              </div>
            </footer>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
